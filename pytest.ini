[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    -m "not perf and not slow"
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    perf: performance tests (excluded from Sprint 8 default run)

# Sprint 8 / TEST-4: быстрый прогон — `pytest` (без perf и slow, ~20 с)
# Sprint 8 / TEST-2–3: полный отчёт + coverage ≥80% — `python tests/generate_test_report.py`
#
# TEST-1 (обязательные домены):
#   tests/test_sprint8.py              — crypto, vault, clipboard, import/export
#   tests/test_sprint8_storage_integration.py — io_storage, key_exchange, io_integration
# Наследие спринтов 1–7: tests/test_*.py (кроме perf/slow по маркерам в conftest.py)
